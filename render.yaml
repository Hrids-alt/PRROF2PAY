# Render blueprint on FREE plans (no cost). Caveats: free web instances sleep after 15 minutes
# idle (ping /login every 5 min with a free uptime monitor), and free Render Postgres expires after
# 30 days (use a free Neon database instead, or recreate and re-seed before judging).
# Migrations are run by hand: DATABASE_URL=... npm run migrate && npm run seed
services:
  - type: web
    name: proof2pay
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase: { name: proof2pay-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false # set to https://<your-service>.onrender.com after the first deploy
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "true"
databases:
  - name: proof2pay-db
    plan: free
