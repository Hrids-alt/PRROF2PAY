# Render blueprint. Adjust plans: the web service must be always-on (free instances sleep after
# 15 minutes and would miss PayPal webhooks), and the database must outlast the judging period
# (Render free Postgres expires after 30 days).
services:
  - type: web
    name: proof2pay
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase: { name: proof2pay-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false # set to https://<your-service>.onrender.com after the first deploy
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "true"
databases:
  - name: proof2pay-db
    plan: basic-256mb
